<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shakego To Go - Inicio</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- HEADER / NAVBAR -->
    <header class="site-header">
        <nav class="nav" aria-label="Navegación principal">
          <!-- Logo izquierda -->
          <a class="brand" href="index.html" aria-label="Ir a Inicio">
            <img class="brand__logo" src="Imagenes/Logo sin fondo.png" alt="Shakego To Go" />
          </a>

          <!-- Botón menú mobile -->
          <button class="nav__toggle" type="button" aria-label="Abrir menú" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>

          <!-- Links derecha -->
          <div class="nav__links" id="navLinks">
            <a class="nav__link" href="index.html" data-page="index.html">Inicio</a>
            <!-- <a class="nav__link" href="productos.html" data-page="productos.html">Nuestros Productos</a>-->
            <a class="nav__link" href="maquina.html" data-page="maquina.html">Nuestra Máquina</a>
            <a class="nav__link" href="contacto.html" data-page="contacto.html">Contáctanos</a>
          </div>
        </nav>
    </header>

    <!-- HERO VERDE -->
    <main>
      
      <section class="hero">
          <img src="Imagenes/Lineas1.png" alt="Imagen fondo" class="image-stack__back">
          <img src="Imagenes/Maquina con sombra.png" alt="Máquina Shakego" class="machine machine--left" />

          <a href="maquina.html" class="hero__button">
            Conoce Nuestras<br>Máquinas
          </a>
        </div>
      </section>

      <!-- MENÚ DE PRODUCTOS -->
      <section class="products">
        <div class="products__wrap">
          <h2 class="products__title">Menú de Productos</h2>
          <p class="products__subtitle">Aquí encontraras nuestras opciones de<br>sabores</p>

          <img src="Imagenes/Vasos.png" style="width: 60%; display: block; margin: 0 auto;">


          <div class="cards">
            <!-- Chocolate -->
            <a class="card" href="productos.html#chocolate" aria-label="Ver Chocolate">
              <div class="card__circle">
                <img src="Imagenes/Chocolate.png" alt="Chocolate" />
              </div>
              <p class="card__name">Chocolate</p>
            </a>

          
            <!-- Vainilla -->
            <a class="card" href="productos.html#vainilla" aria-label="Ver Vainilla">
              <div class="card__circle">
                <img src="Imagenes/Vainilla.png" alt="Vainilla" />
              </div>
              <p class="card__name">Vainilla</p>
            </a>

            <!-- Aire -->
            <a class="card" href="productos.html#aire" aria-label="Ver Aire">
              <div class="card__circle">
                <img src="Imagenes/Fresa.png" alt="Aire" />
              </div>
              <p class="card__name">Fresa</p>
            </a>
          </div>
        </div>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <div class="footer__wrap">
        <div class="footer__box">
          <h4 class="footer__title">Contáctanos:</h4>
          <ul class="footer__list">
            <li>comercial@shakego.com</li>
            <li>(601) 1234567</li>
          </ul>
        </div>

        <div class="footer__box">
              <h4 class="footer__title">Síguenos en:</h4>
              <div class="footer__social">
                  <a href="https://instagram.com/tucuenta" target="_blank">
                      <img src="Imagenes/Instagram Logo.png" alt="Instagram">
                  </a>
                  <a href="https://facebook.com/tucuenta" target="_blank">
                      <img src="Imagenes/tiktok.png" alt="TikTok">
                  </a>
              </div>
        </div>

        <div class="footer__box">
          <h4 class="footer__title">Nuestra Política</h4>
          <ul class="footer__list">
            <li>Términos y condiciones</li>
            <li>Política de privacidad</li>
          </ul>
        </div>
      </div>
    </footer>

    <script src="app.js"></script>
    <script src="menuMobile.js"></script>
</body>
</html>
